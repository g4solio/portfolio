<title>cabinet</title>
<!-- The /meet/ cabinet, rendered once. Opened by scripts/cabinet.mjs in headless Chrome; three.js is a dev dependency.
     Hash picks the camera (#front, #quarter). ?theme= picks the cabinet's world: casebook (paper, as the site),
     arcade (a dark room), garage (plywood, at home). ?bg=paper composites the casebook theme on paper. -->
<style>
@font-face{font-family:"Space Grotesk";src:url("../../app/fonts/space-grotesk-latin-wght-normal.woff2") format("woff2");font-weight:300 700}
@font-face{font-family:"JetBrains Mono";src:url("../../app/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2");font-weight:100 800}
@font-face{font-family:"Silkscreen";src:url("../../app/fonts/silkscreen-latin-400-normal.woff2") format("woff2");font-weight:400}
html,body{margin:0;background:transparent}
body.paper{background:#f7f5f1}
canvas{display:block}
#meta{position:absolute;left:0;top:0;margin:0;opacity:0;font:10px monospace}
</style>
<script type="importmap">{"imports":{"three":"../../node_modules/three/build/three.module.js","three/addons/":"../../node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<pre id="meta"></pre>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const params = new URLSearchParams(location.search);
const variant = (location.hash || "#front").slice(1);

// Casebook tokens.
const PAPER = "#f7f5f1", BAND = "#efece3", DARK = "#e6e2d8", INK = "#1b1b18", ACCENT = "#2b5bc7", RULE = "#dad6cb";
const CRT = "#0b0d0b", CRT_TEXT = "#d9d9d3", CRT_HI = "#7ea2ea";

// Sticker inks: the casebook world keeps the palette, the other two print in colour.
const CASEBOOK_INK = { body: INK, eye: CRT_HI, hat: ACCENT, blue: ACCENT, grey: CRT_HI, green: INK, paper: PAPER, warn: ACCENT, red: ACCENT, label: INK, text: PAPER, cut: "#ffffff" };
const COLOUR_INK = { body: "#141414", eye: "#9be36d", hat: "#2b5bc7", blue: "#2b5bc7", grey: "#8a8f99", green: "#3aa655", paper: "#ffffff", warn: "#ffcc00", red: "#d8352a", label: "#141414", text: "#ffffff", cut: "#ffffff" };

// Three worlds for one cabinet.
const THEMES = {
  casebook: {
    bg: null, wall: null, floor: "grid", light: "studio", marquee: "paper",
    side: BAND, edge: BAND, wedge: DARK, silhouette: INK, fire: [ACCENT, CRT_HI], skin: PAPER,
    body: PAPER, housing: BAND, panel: PAPER, kick: DARK, bezel: INK, ball: INK, button: ACCENT,
    lines: { color: INK, opacity: 0.38 }, ink: CASEBOOK_INK, environment: 0.4, exposure: 1.0,
  },
  arcade: {
    bg: "#07080f", wall: "#0b0d1a", floor: "carpet", light: "arcade", marquee: "lit",
    side: "#171d3f", edge: "#3fe0ff", wedge: "#ff2d95", silhouette: "#05060b", fire: ["#ff7a1a", "#ffe14a"], skin: "#f2e9d8",
    body: "#171d3f", housing: "#10142c", panel: "#10142c", kick: "#05060b", bezel: "#05060b", ball: "#ff2d95", button: "#ffd23f",
    lines: { color: "#3fe0ff", opacity: 0.9 }, ink: COLOUR_INK, environment: 0.1, exposure: 1.15,
  },
  garage: {
    bg: "#e7dccb", wall: "#e7dccb", floor: "terracotta", light: "window", marquee: "paper", cat: true,
    side: "plywood", edge: "#cdb27f", wedge: null, silhouette: INK, fire: [ACCENT, PAPER], skin: PAPER,
    body: INK, housing: INK, panel: INK, kick: "#30302b", bezel: INK, ball: "#d8352a", button: ACCENT,
    lines: null, ink: COLOUR_INK, environment: 0.35, exposure: 1.0,
  },
};
const theme = THEMES[params.get("theme") ?? "casebook"];
const ink = theme.ink;
// bg=clear (default): a transparent still for the page, the floor fading out; bg=room: the whole world,
// for comparison sheets; bg=paper: the casebook theme composited on paper.
const bgMode = params.get("bg") ?? "clear";
const room = bgMode === "room";

// Cabinet proportions, metres. A classic upright: the monitor set back in a tilted recess
// between the side panels, the control panel in front of it, the marquee hood above.
const W = 0.72, D = 0.75, T = 0.03;
const PROFILE = [[-0.375, 0], [0.375, 0], [0.375, 1.02], [0.26, 1.06], [0.09, 1.7], [0.21, 1.74], [0.21, 1.85], [-0.375, 1.85]];
const SCREEN_W = 0.42, SCREEN_H = 0.56, SCREEN_Y = 1.4, SCREEN_Z = 0.135, SCREEN_TILT = -Math.atan2(0.17, 0.64);
const PANEL_Y = 1.055, PANEL_Z = 0.345, PANEL_TILT = 0.19;
const FRONT = -0.0075 + 0.735 / 2 + 0.0015; // a sticker's depth on the lower body
const deg = (d) => (d * Math.PI) / 180;

// Cameras: #quarter is the hero (the whole cabinet in its room), #play stands at it for the live screen, #front is the reference elevation.
const OUT_W = 1200, OUT_H = variant === "play" ? 1500 : 1600;

await Promise.all([
  document.fonts.load('400 14px "Silkscreen"'),
  document.fonts.load('400 16px "JetBrains Mono"'),
  document.fonts.load('600 80px "Space Grotesk"'),
  document.fonts.load('700 80px "Space Grotesk"'),
]);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio || 1);
renderer.setSize(OUT_W, OUT_H);
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = theme.exposure;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = theme.environment;
if (room && theme.bg) scene.background = new THREE.Color(theme.bg);
else if (bgMode === "paper") document.body.classList.add("paper");

const cabinet = new THREE.Group();
scene.add(cabinet);

const material = (color, roughness = 0.88) => new THREE.MeshStandardMaterial({ color, roughness, metalness: 0 });
const lineMaterial = theme.lines ? new THREE.LineBasicMaterial({ color: theme.lines.color, transparent: true, opacity: theme.lines.opacity }) : null;
const texture = (canvas, repeat) => {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); }
  return t;
};
const canvas = (w, h, draw) => {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  return c;
};
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/** A bevelled block with its hairline edges drawn, the casebook way. */
function block(w, h, d, color, x, y, z, { radius = 0.012, rx = 0, edges = true, parent = cabinet } = {}) {
  const mesh = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, radius), material(color));
  mesh.position.set(x, y, z);
  mesh.rotation.x = rx;
  mesh.castShadow = mesh.receiveShadow = true;
  parent.add(mesh);
  if (edges && lineMaterial) {
    const line = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, d)), lineMaterial);
    line.position.copy(mesh.position);
    line.rotation.copy(mesh.rotation);
    parent.add(line);
  }
  return mesh;
}

// Side art: the designated Mage casting, a 24 x 34 grid of 3 cm cells that stays inside the panel's
// full-width part. Faces the player; drawn with the gaps a side-on view needs: brim wider than the
// shoulders, the arm out in front, the staff clear of the robe. # silhouette, w beard and hands, f o fire.
const MAGE = Array.from({ length: 34 }, () => Array(24).fill("."));
const span = (r, c0, c1, ch = "#") => { for (let c = c0; c <= c1; c++) MAGE[r][c] = ch; };
["..fffff..", ".fffffff.", "ffoooooff", "ffoooooff", "ffoooooff", ".fffffff.", "..fffff.."].forEach((row, i) => [...row].forEach((ch, j) => { if (ch !== ".") MAGE[8 + i][j] = ch; }));
span(6, 4, 4, "f"); span(7, 3, 3, "f"); span(7, 5, 5, "f"); // flame
span(0, 16, 16); span(1, 16, 16); span(2, 15, 17); span(3, 15, 17); span(4, 14, 18); span(5, 14, 18); span(6, 13, 19); span(7, 13, 19); span(8, 12, 20); span(9, 9, 22); // hat, brim
span(10, 13, 19); span(11, 13, 19); // head
for (let r = 12; r <= 33; r++) span(r, r < 18 ? 12 : r < 24 ? 11 : r < 30 ? 10 : 9, 20); // robe
span(15, 9, 11); span(16, 8, 11); span(17, 8, 11); span(18, 9, 11); // the sleeve, out toward the player
span(16, 6, 7, "w"); span(17, 6, 7, "w"); // the hand under the ball
for (let r = 12; r <= 14; r++) span(r, 14, 18, "w"); span(15, 15, 17, "w"); span(16, 15, 17, "w"); span(17, 16, 16, "w"); // beard
span(20, 11, 20, "f"); // sash
for (let r = 4; r <= 33; r++) span(r, 22, 22); span(1, 22, 22, "o"); span(2, 21, 23, "o"); span(3, 22, 22, "o"); // staff, crystal

function plywood(g, w, h) {
  g.fillStyle = "#dcc59f"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) {
    const x = rnd() * w, amp = 6 + rnd() * 18;
    g.strokeStyle = rnd() < 0.5 ? "rgba(150,110,60,0.22)" : "rgba(255,245,220,0.3)";
    g.lineWidth = 1 + rnd() * 3;
    g.beginPath(); g.moveTo(x, 0);
    for (let y = 0; y <= h; y += 60) g.lineTo(x + Math.sin(y / 140 + i) * amp, y);
    g.stroke();
  }
}

// 1000 texels per metre; u = 0 is the cabinet's front edge, the geometry clips the rest.
const sideArt = canvas(750, 1850, (g, w, h) => {
  if (theme.side === "plywood") plywood(g, w, h); else { g.fillStyle = theme.side; g.fillRect(0, 0, w, h); }
  if (theme.wedge) { g.fillStyle = theme.wedge; g.beginPath(); g.moveTo(0, 1350); g.lineTo(w, 650); g.lineTo(w, 1150); g.lineTo(0, h); g.closePath(); g.fill(); }
  const cell = 30, x0 = 30, y0 = h - 60 - MAGE.length * cell;
  MAGE.forEach((row, r) => row.forEach((ch, c) => {
    const color = ch === "#" ? theme.silhouette : ch === "f" ? theme.fire[0] : ch === "o" ? theme.fire[1] : ch === "w" ? theme.skin : null;
    if (color) { g.fillStyle = color; g.fillRect(x0 + c * cell, y0 + r * cell, cell, cell); }
  }));
});
const sideTexture = texture(sideArt);
sideTexture.repeat.set(-1 / D, 1 / 1.85); // shape x runs back to front; flip so the texture's left is the front
sideTexture.offset.set(0.5, 0);

// Side panels: the silhouette, extruded. Everything else sits between them.
const shape = new THREE.Shape(PROFILE.map(([z, y]) => new THREE.Vector2(z, y)));
const sideGeometry = new THREE.ExtrudeGeometry(shape, { depth: T, bevelEnabled: false });
const sideMaterials = [
  new THREE.MeshStandardMaterial({ map: sideTexture, roughness: theme.side === "plywood" ? 0.8 : 0.6, metalness: 0 }),
  theme.light === "arcade" ? new THREE.MeshStandardMaterial({ color: theme.edge, emissive: theme.edge, emissiveIntensity: 0.6, roughness: 0.5 }) : material(theme.edge, 0.9),
];
for (const sign of [-1, 1]) {
  const side = new THREE.Mesh(sideGeometry, sideMaterials);
  side.rotation.y = -Math.PI / 2; // local x → world z, thickness toward -x
  side.position.x = sign > 0 ? W / 2 : -W / 2 + T;
  side.castShadow = side.receiveShadow = true;
  cabinet.add(side);
  if (lineMaterial) {
    const outline = new THREE.LineSegments(new THREE.EdgesGeometry(sideGeometry, 20), lineMaterial);
    outline.rotation.copy(side.rotation);
    outline.position.copy(side.position);
    cabinet.add(outline);
  }
}

const inner = W - 2 * T;
block(inner, 1.02, 0.735, theme.body, 0, 0.51, -0.0075); // lower body
block(inner - 0.04, 0.14, 0.02, theme.kick, 0, 0.09, 0.37, { radius: 0.006 }); // kick plate
const coinDoor = block(0.15, 0.11, 0.012, theme.bezel, 0.13, 0.5, 0.372, { radius: 0.004 }); // coin door
block(inner, 0.66, 0.42, theme.housing, 0, 1.39, -0.165); // monitor housing, behind the screen
block(inner, 0.13, 0.57, theme.body, 0, 1.785, -0.09); // marquee box, under the hood
block(inner, 0.05, 0.22, theme.panel, 0, PANEL_Y, PANEL_Z, { rx: PANEL_TILT }); // control panel, sloping toward the player

// The screen assembly, tilted with the recess: bezel, tube face, glass.
const screenGroup = new THREE.Group();
screenGroup.position.set(0, SCREEN_Y, SCREEN_Z);
screenGroup.rotation.x = SCREEN_TILT;
cabinet.add(screenGroup);
const bezel = block(SCREEN_W + 0.08, SCREEN_H + 0.08, 0.03, theme.bezel, 0, 0, -0.02, { radius: 0.01, edges: false, parent: screenGroup });
bezel.material.roughness = 0.6;

// The hero's tube shows the attract screen in type large enough to read at hero size; the play view's
// tube stays blank because the page draws the live screen over it.
const screenCanvas = canvas(600, 800, (g, w, h) => {
  g.fillStyle = CRT; g.fillRect(0, 0, w, h);
  if (variant !== "play") {
    const pixel = (size) => `400 ${size}px "Silkscreen"`;
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillStyle = CRT_HI; g.font = pixel(26); g.fillText("DAVIDE GOZZI", w / 2, 150);
    g.fillStyle = CRT_TEXT; g.font = pixel(18); g.fillText("PRESENTS", w / 2, 196);
    g.font = pixel(52); ["PLAYER 2", "WANTED"].forEach((l, i) => g.fillText(l, w / 2, 340 + i * 74));
    g.fillStyle = CRT_HI; g.font = pixel(34); g.fillText("INSERT COIN", w / 2, 580);
    g.fillStyle = "#6f726e"; g.font = '400 20px "JetBrains Mono"'; ["13 questions about your role", "17 facts about me · 1 brief at the end"].forEach((l, i) => g.fillText(l, w / 2, 670 + i * 30));
  }
  // scanlines and a soft vignette: the tube, not the UI
  g.fillStyle = "rgba(0,0,0,0.22)";
  for (let y = 0; y < h; y += 3) g.fillRect(0, y, w, 1);
  const v = g.createRadialGradient(w / 2, h / 2, h * 0.35, w / 2, h / 2, h * 0.75);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.5)");
  g.fillStyle = v; g.fillRect(0, 0, w, h);
});
const screen = new THREE.Mesh(new THREE.PlaneGeometry(SCREEN_W, SCREEN_H), new THREE.MeshBasicMaterial({ map: texture(screenCanvas) }));
screenGroup.add(screen);
const glass = new THREE.Mesh(
  new THREE.PlaneGeometry(SCREEN_W + 0.02, SCREEN_H + 0.02),
  new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.07, roughness: 0.08, metalness: 0, envMapIntensity: 1.2 }),
);
glass.position.z = 0.004;
screenGroup.add(glass);
// The tube's glow on the bezel and the panel.
const glow = new THREE.PointLight(CRT_HI, theme.light === "arcade" ? 4 : theme.light === "window" ? 0.6 : 0.3, theme.light === "arcade" ? 2 : 0.9, 2);
glow.position.set(0, SCREEN_Y - 0.12, SCREEN_Z + 0.2);
cabinet.add(glow);

const lit = theme.marquee === "lit";
const marqueeCanvas = canvas(1200, 220, (g, w, h) => {
  g.fillStyle = lit ? CRT : PAPER; g.fillRect(0, 0, w, h);
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = lit ? "#3fe0ff" : "#68665e"; g.font = '400 24px "JetBrains Mono"';
  g.fillText("D A V I D E   G O Z Z I   ·   A R C A D E", w / 2, 62);
  g.fillStyle = lit ? PAPER : INK; g.font = '600 74px "Space Grotesk"';
  g.fillText("Let’s get to know each other", w / 2, 132);
  g.fillStyle = lit ? "#ff2d95" : RULE; g.fillRect(80, 192, w - 160, 2);
});
const marqueeTexture = texture(marqueeCanvas);
const marquee = new THREE.Mesh(
  new THREE.PlaneGeometry(0.6, 0.11),
  lit
    ? new THREE.MeshStandardMaterial({ map: marqueeTexture, emissive: "#ffffff", emissiveMap: marqueeTexture, emissiveIntensity: 1.6, color: "#202020", roughness: 0.4 })
    : new THREE.MeshStandardMaterial({ map: marqueeTexture, roughness: 0.9 }),
);
marquee.position.set(0, 1.785, 0.1962);
cabinet.add(marquee);

// Joystick and the one button, standing on the panel's top surface.
const panelTop = (z) => PANEL_Y + 0.025 - (z - PANEL_Z) * Math.tan(PANEL_TILT);
const part = (geometry, mat, y) => {
  const mesh = new THREE.Mesh(geometry, mat);
  mesh.position.set(0, y, 0);
  mesh.castShadow = mesh.receiveShadow = true;
  return mesh;
};
const stick = new THREE.Group();
stick.add(part(new THREE.CylinderGeometry(0.03, 0.03, 0.006, 24), material(INK, 0.6), 0.003));
stick.add(part(new THREE.CylinderGeometry(0.006, 0.006, 0.085, 16), material(INK, 0.5), 0.0425));
stick.add(part(new THREE.SphereGeometry(0.024, 24, 16), material(theme.ball, 0.45), 0.095));
stick.position.set(-0.17, panelTop(0.36), 0.36);
stick.rotation.x = PANEL_TILT;
cabinet.add(stick);
const buttonGroup = new THREE.Group();
buttonGroup.add(part(new THREE.TorusGeometry(0.026, 0.004, 12, 48), material(INK, 0.6), 0.002));
buttonGroup.children[0].rotation.x = Math.PI / 2;
buttonGroup.add(part(new THREE.CylinderGeometry(0.021, 0.021, 0.014, 32), material(theme.button, 0.5), 0.009));
buttonGroup.position.set(0.15, panelTop(0.36), 0.36);
buttonGroup.rotation.x = PANEL_TILT;
cabinet.add(buttonGroup);

// Stickers. Pixel ones are code grids with a one-cell die-cut border; printed ones are drawn at 4000 texels per metre.
const SPRITES = {
  cat: { pal: { "#": "body", o: "eye" }, rows: ["#....#......", "##..##......", "######......", "#o##o#......", "######......", ".####.......", "######......", "#######.....", "#######.....", "#######...#.", "#######..##.", "#######.##..", "#########...", "##.###......"] },
  hat: { pal: { "#": "hat", o: "paper" }, rows: ["......#.......", ".....###......", ".....###......", "....#####.....", "....#####.....", "...#######....", "...#######....", "..#########...", "..####o####...", ".###########..", "##############", ".############."] },
  lute: { pal: { "#": "blue", o: "body" }, rows: ["...##.....", "....##....", ".....#....", ".....#....", "....###...", "...#####..", "..#######.", ".#########", ".###oo####", ".###oo####", ".#########", "..#######.", "...#####..", "....###..."] },
  pad: { pal: { "#": "grey", o: "body" }, rows: ["....########....", "..############..", ".##############.", "###o#######o####", "##ooo####o#o####", "###o#######o####", ".##############.", "..####....####..", "..###......###.."] },
  phones: { pal: { "#": "body" }, rows: ["....######....", "..##......##..", ".#..........#.", ".#..........#.", "#............#", "#............#", "##..........##", "###........###", "###........###", "###........###", "###........###", ".##........##."] },
  mail: { pal: { "#": "body", o: "paper" }, rows: ["##############", "#oooooooooooo#", "##oooooooooo##", "#o##oooooo##o#", "#ooo##oo##ooo#", "#ooooo##ooooo#", "#oooooooooooo#", "#oooooooooooo#", "#oooooooooooo#", "##############"] },
  bubble: { pal: { "#": "body", o: "paper" }, rows: [".############.", "#oooooooooooo#", "#oooooooooooo#", "#oo##o##o##oo#", "#oo##o##o##oo#", "#oooooooooooo#", "#oooooooooooo#", ".############.", "...###........", "..##..........", ".#............"] },
  dino: { pal: { "#": "green" }, rows: ["..........########..", ".........##########.", ".........##.#######.", ".........##########.", ".........#######....", ".........##########.", "#........#######....", "#.......########....", "##.....#########....", "###...##########....", "################....", ".###############....", "..#############.....", "...###########......", "....#########.......", ".....##...##........", ".....##...##........", ".....#....#.........", ".....##...##........"] },
};
function pixelSticker(name, cell) {
  const { rows, pal } = SPRITES[name];
  const h = rows.length, w = Math.max(...rows.map((r) => r.length)), px = 8;
  const cells = [];
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (pal[ch]) cells.push([x + 1, y + 1, ink[pal[ch]]]); }));
  const c = canvas((w + 2) * px, (h + 2) * px, (g) => {
    g.fillStyle = ink.cut;
    for (const [x, y] of cells) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) g.fillRect((x + dx) * px, (y + dy) * px, px, px);
    for (const [x, y, color] of cells) { g.fillStyle = color; g.fillRect(x * px, y * px, px, px); }
  });
  return [c, (w + 2) * cell, (h + 2) * cell];
}
const PX = 4000;
const printed = (w, h, draw) => [canvas(Math.round(w * PX), Math.round(h * PX), draw), w, h];
const cut = (g, w, h, r, fill, inset = 10) => {
  g.fillStyle = ink.cut; g.beginPath(); g.roundRect(0, 0, w, h, r); g.fill();
  g.fillStyle = fill; g.beginPath(); g.roundRect(inset, inset, w - 2 * inset, h - 2 * inset, Math.max(2, r - inset)); g.fill();
};
const centred = (g) => { g.textAlign = "center"; g.textBaseline = "middle"; };
const STICKERS = {
  cat: pixelSticker("cat", 0.0065), hat: pixelSticker("hat", 0.006), lute: pixelSticker("lute", 0.0065), pad: pixelSticker("pad", 0.006),
  phones: pixelSticker("phones", 0.006), mail: pixelSticker("mail", 0.0055), bubble: pixelSticker("bubble", 0.0055), dino: pixelSticker("dino", 0.0045),
  mo: printed(0.1, 0.066, (g, w, h) => { // the province plate
    for (const [pad, color] of [[0, ink.cut], [10, ink.body], [26, ink.paper]]) { g.fillStyle = color; g.beginPath(); g.ellipse(w / 2, h / 2, w / 2 - pad, h / 2 - pad, 0, 0, 7); g.fill(); }
    g.fillStyle = ink.body; g.font = `700 ${h * 0.56}px "Space Grotesk"`; centred(g); g.fillText("MO", w / 2, h / 2 + 4);
  }),
  twice: printed(0.15, 0.062, (g, w, h) => { // the bug that lives in his head
    cut(g, w, h, 20, ink.warn);
    const band = (x0) => {
      g.save(); g.beginPath(); g.rect(x0, 10, 70, h - 20); g.clip(); g.fillStyle = ink.body;
      for (let x = x0 - h; x < x0 + 70 + h; x += 36) { g.beginPath(); g.moveTo(x, 10); g.lineTo(x + 18, 10); g.lineTo(x + 18 - (h - 20), h - 10); g.lineTo(x - (h - 20), h - 10); g.closePath(); g.fill(); }
      g.restore();
    };
    band(10); band(w - 80);
    g.fillStyle = ink.body; g.font = `400 ${h * 0.18}px "Silkscreen"`; centred(g); g.fillText("ENUMERATED", w / 2, h * 0.37); g.fillText("TWICE", w / 2, h * 0.66);
  }),
  linq: printed(0.11, 0.05, (g, w, h) => {
    cut(g, w, h, 24, ink.paper);
    g.lineWidth = 8; g.strokeStyle = ink.body; g.beginPath(); g.roundRect(16, 16, w - 32, h - 32, 14); g.stroke();
    const cx = 72, cy = h / 2 - 4, s = 26; // a heart
    g.fillStyle = ink.red; g.beginPath(); g.moveTo(cx, cy + s);
    g.bezierCurveTo(cx - s * 1.6, cy - s * 0.2, cx - s * 0.6, cy - s * 1.4, cx, cy - s * 0.5);
    g.bezierCurveTo(cx + s * 0.6, cy - s * 1.4, cx + s * 1.6, cy - s * 0.2, cx, cy + s); g.fill();
    g.fillStyle = ink.body; g.font = `700 ${h * 0.58}px "Space Grotesk"`; g.textBaseline = "middle"; g.textAlign = "left"; g.fillText("LINQ", 118, h / 2 + 4);
  }),
  tag: printed(0.11, 0.045, (g, w, h) => { cut(g, w, h, 22, ink.label); g.fillStyle = ink.text; g.font = `400 ${h * 0.5}px "Silkscreen"`; centred(g); g.fillText("g4solio", w / 2, h / 2 + 2); }),
  prompt: printed(0.06, 0.045, (g, w, h) => { cut(g, w, h, 22, ink.label); g.fillStyle = ink.eye; g.font = `400 ${h * 0.6}px "Silkscreen"`; centred(g); g.fillText(">_", w / 2, h / 2 + 4); }),
  player: printed(0.1, 0.028, (g, w, h) => { g.fillStyle = CRT_TEXT; g.beginPath(); g.roundRect(0, 0, w, h, 10); g.fill(); g.fillStyle = INK; g.font = `600 ${h * 0.5}px "JetBrains Mono"`; g.letterSpacing = "6px"; centred(g); g.fillText("PLAYER 1", w / 2 + 3, h / 2 + 2); }),
  d20: printed(0.08, 0.09, (g, w, h) => {
    const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 4;
    const corner = (i, r) => [cx + r * Math.cos(-Math.PI / 2 + (i * Math.PI) / 3), cy + r * Math.sin(-Math.PI / 2 + (i * Math.PI) / 3)];
    const hex = (r) => { g.beginPath(); for (let i = 0; i < 6; i++) g[i ? "lineTo" : "moveTo"](...corner(i, r)); g.closePath(); };
    for (const [pad, color] of [[0, ink.cut], [14, ink.body], [26, ink.red]]) { g.fillStyle = color; hex(R - pad); g.fill(); }
    const r2 = R - 26, pts = [0, 1, 2, 3, 4, 5].map((i) => corner(i, r2));
    const tri = [[cx, cy - r2 * 0.55], [cx + r2 * 0.5, cy + r2 * 0.3], [cx - r2 * 0.5, cy + r2 * 0.3]];
    g.strokeStyle = ink.body; g.lineWidth = 7; g.lineJoin = "round";
    g.beginPath(); tri.forEach((p, i) => g[i ? "lineTo" : "moveTo"](...p)); g.closePath(); g.stroke();
    for (const [t, p] of [[0, 0], [1, 2], [2, 4], [0, 1], [1, 1], [1, 3], [2, 3], [2, 5], [0, 5]]) { g.beginPath(); g.moveTo(...tri[t]); g.lineTo(...pts[p]); g.stroke(); }
    g.fillStyle = ink.paper; g.font = `700 ${r2 * 0.5}px "Space Grotesk"`; centred(g); g.fillText("20", cx, cy + r2 * 0.03);
  }),
};
function stickOn(name, parent, pos, rot, order = "XYZ") {
  const [c, w, h] = STICKERS[name];
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: texture(c), transparent: true, alphaTest: 0.2, roughness: 0.5, metalness: 0 }));
  mesh.position.set(...pos);
  mesh.rotation.set(rot[0], rot[1], rot[2], order);
  mesh.receiveShadow = true;
  parent.add(mesh);
}
// On the lower body, around the coin door.
for (const [name, x, y, roll] of [["cat", -0.22, 0.8, 6], ["twice", -0.12, 0.63, -4], ["mo", -0.25, 0.5, 3], ["dino", -0.09, 0.4, -8], ["pad", -0.24, 0.3, 5], ["lute", 0.02, 0.81, 10], ["mail", 0.26, 0.69, -6], ["bubble", 0.27, 0.36, 4], ["tag", 0.13, 0.35, -3], ["linq", 0.2, 0.86, -2]]) {
  stickOn(name, cabinet, [x, y, FRONT], [0, 0, deg(roll)]);
}
// On the right side, down by the front edge, where a hand reaches while playing.
for (const [name, z, y, roll] of [["phones", 0.29, 0.46, -7], ["hat", 0.28, 0.64, 5], ["d20", 0.3, 0.26, 8], ["prompt", 0.22, 0.14, -4]]) {
  stickOn(name, cabinet, [W / 2 + 0.0015, y, z], [0, Math.PI / 2, deg(roll)], "YXZ");
}
stickOn("player", cabinet, [0, panelTop(0.425) + 0.0015, 0.425], [-Math.PI / 2 + PANEL_TILT, 0, 0]);
stickOn("prompt", screenGroup, [-(SCREEN_W / 2 + 0.018), -(SCREEN_H / 2 + 0.014), -0.004], [0, 0, deg(-6)]);

// The cat on top, in the garage: a loaf, a head, two ears, a tail.
if (theme.cat) {
  const fur = material(INK, 0.95);
  const cat = new THREE.Group();
  const body = part(new THREE.SphereGeometry(1, 32, 24), fur, 0.065); body.scale.set(0.075, 0.065, 0.12); cat.add(body);
  const head = part(new THREE.SphereGeometry(0.052, 32, 24), fur, 0.11); head.position.z = 0.11; cat.add(head);
  for (const sx of [-1, 1]) { const ear = part(new THREE.ConeGeometry(0.016, 0.034, 4), fur, 0.158); ear.position.set(sx * 0.028, 0.158, 0.1); ear.rotation.y = Math.PI / 4; cat.add(ear); }
  const tail = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0.03, -0.1), new THREE.Vector3(0.06, 0.02, -0.14), new THREE.Vector3(0.12, 0.02, -0.08), new THREE.Vector3(0.13, 0.025, 0)]), 24, 0.013, 10), fur);
  tail.castShadow = true; cat.add(tail);
  cat.position.set(0.04, 1.85, -0.1);
  cat.rotation.y = 0.35;
  cabinet.add(cat);
}

// Floor and wall.
const contact = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5), new THREE.MeshBasicMaterial({ map: texture(canvas(512, 512, (g) => {
  const s = g.createRadialGradient(256, 256, 60, 256, 256, 256);
  s.addColorStop(0, "rgba(27,27,24,0.42)"); s.addColorStop(0.55, "rgba(27,27,24,0.14)"); s.addColorStop(1, "rgba(27,27,24,0)");
  g.fillStyle = s; g.fillRect(0, 0, 512, 512);
})), transparent: true, depthWrite: false }));
contact.rotation.x = -Math.PI / 2;
contact.position.set(0, 0.001, 0.02);
scene.add(contact);
if (theme.floor === "grid") {
  const grid = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshBasicMaterial({ map: texture(canvas(2048, 2048, (g, w, h) => {
    g.strokeStyle = RULE; g.lineWidth = 2;
    for (let i = 0; i <= 24; i++) { const p = (i / 24) * w; g.beginPath(); g.moveTo(p, 0); g.lineTo(p, h); g.stroke(); g.beginPath(); g.moveTo(0, p); g.lineTo(w, p); g.stroke(); }
    g.globalCompositeOperation = "destination-in";
    const fade = g.createRadialGradient(w / 2, h / 2, w * 0.08, w / 2, h / 2, w * 0.5);
    fade.addColorStop(0, "rgba(0,0,0,0.9)"); fade.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = fade; g.fillRect(0, 0, w, h);
  })), transparent: true, depthWrite: false }));
  grid.rotation.x = -Math.PI / 2;
  grid.position.set(0, 0.0005, -1.5);
  scene.add(grid);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.ShadowMaterial({ opacity: 0.16 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);
} else {
  const carpet = (g, w, h) => {
    g.fillStyle = "#121840"; g.fillRect(0, 0, w, h);
    const colors = ["#ff2d95", "#3fe0ff", "#ffd23f", "#9be36d", "#b36bff"];
    for (let i = 0; i < 700; i++) {
      const x = rnd() * w, y = rnd() * h, s = 14 + rnd() * 30, k = rnd();
      g.fillStyle = g.strokeStyle = colors[i % colors.length]; g.lineWidth = 6; g.lineCap = "round";
      g.beginPath();
      if (k < 0.3) { g.moveTo(x, y - s); g.lineTo(x + s, y + s); g.lineTo(x - s, y + s); g.closePath(); g.fill(); }
      else if (k < 0.55) { g.arc(x, y, s * 0.5, 0, 7); g.fill(); }
      else if (k < 0.8) { g.moveTo(x - s, y); g.bezierCurveTo(x - s / 2, y - s, x + s / 2, y + s, x + s, y); g.stroke(); }
      else { g.save(); g.translate(x, y); g.rotate(rnd() * Math.PI); g.fillRect(-s, -4, 2 * s, 8); g.restore(); }
    }
  };
  const terracotta = (n) => (g, w, h) => { // n tiles of 25 cm across the canvas
    g.fillStyle = "#d6c9b6"; g.fillRect(0, 0, w, h);
    const size = w / n, gap = Math.max(4, Math.round(size / 25));
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      g.fillStyle = `hsl(${17 + rnd() * 6}, ${34 + rnd() * 8}%, ${50 + rnd() * 8}%)`;
      g.fillRect(i * size + gap / 2, j * size + gap / 2, size - gap, size - gap);
    }
  };
  // In the room the floor repeats to the walls. On the page it is a six-metre patch under the cabinet
  // whose alpha fades out from about a metre, so the wall colour of the page takes over.
  const fade = (draw) => (g, w, h) => {
    draw(g, w, h);
    g.globalCompositeOperation = "destination-in";
    const r = g.createRadialGradient(w / 2, h / 2, w * 0.14, w / 2, h / 2, w * 0.46);
    r.addColorStop(0, "rgba(0,0,0,1)"); r.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = r; g.fillRect(0, 0, w, h);
  };
  const size = room ? 12 : 6;
  const draw = theme.floor === "carpet" ? carpet : terracotta(room ? 8 : 24);
  const map = room ? texture(canvas(2048, 2048, draw), 6) : texture(canvas(2048, 2048, fade(draw)));
  map.anisotropy = 16;
  const floorMaterial = new THREE.MeshStandardMaterial({ map, roughness: theme.floor === "carpet" ? 1 : 0.7, transparent: !room });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(size, size), floorMaterial);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);
}
if (room && theme.wall) {
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(14, 7), new THREE.MeshStandardMaterial({ color: theme.wall, roughness: 1 }));
  wall.position.set(0, 3.5, -1.3);
  wall.receiveShadow = true;
  scene.add(wall);
}

// Light.
function keyLight(color, intensity, x, y, z) {
  const key = new THREE.DirectionalLight(color, intensity);
  key.position.set(x, y, z);
  key.target.position.set(0, 0.9, 0);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = key.shadow.camera.bottom = -1.8;
  key.shadow.camera.right = key.shadow.camera.top = 1.8;
  key.shadow.camera.near = 1; key.shadow.camera.far = 12;
  key.shadow.radius = 7;
  key.shadow.blurSamples = 12;
  key.shadow.bias = -0.0003;
  scene.add(key, key.target);
}
const fillLight = (color, intensity, x, y, z) => { const fill = new THREE.DirectionalLight(color, intensity); fill.position.set(x, y, z); scene.add(fill); };
if (theme.light === "studio") { // one soft key from the upper left front, a low fill from the right, a warm sky
  scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d4c8, 0.65));
  keyLight(0xffffff, 2.4, -2.6, 3.8, 3.4);
  fillLight(0xffffff, 0.45, 2.6, 1.8, 2.5);
} else if (theme.light === "arcade") { // a dim room: the sign and the tube do the lighting, a magenta rim from the next cabinet over
  scene.add(new THREE.HemisphereLight("#3a4a8a", "#05060b", 0.3));
  keyLight("#9fb4ff", 0.7, -1.5, 4, 2.5);
  const sign = new THREE.PointLight("#fff1d6", 6, 2.6, 2); sign.position.set(0, 1.7, 0.45); cabinet.add(sign);
  const rim = new THREE.PointLight("#ff2d95", 12, 4, 2); rim.position.set(1.6, 1.5, -1.0); scene.add(rim);
} else { // afternoon from a window on the right, a cool fill from the room
  scene.add(new THREE.HemisphereLight("#fff3e0", "#b79a7a", 0.55));
  keyLight("#ffe2bd", 2.6, 2.4, 3.6, 2.6);
  fillLight("#cfd8ff", 0.35, -2.6, 1.8, 2.5);
}

const camera = new THREE.PerspectiveCamera(24, OUT_W / OUT_H, 0.1, 40);
if (variant === "quarter") { // about 30° off the front: the side art gets half its width, the screen keeps most of its own
  camera.position.set(2.55, 1.55, 4.5);
  camera.lookAt(0.04, 0.98, 0);
} else if (variant === "play") { // standing at the cabinet: the hood, the screen and the panel fill the frame
  camera.position.set(0, 1.5, 2.7);
  camera.lookAt(0, 1.42, 0);
} else {
  camera.position.set(0, 1.32, 5.3);
  camera.lookAt(0, 0.94, 0);
}

renderer.render(scene, camera);

// What the page needs, in image pixels of the CSS frame: the screen's corners (top-left, top-right,
// bottom-right, bottom-left) for the live overlay, the button and the coin door as hotspots, and the
// still itself as WebP straight from the drawing buffer.
const px = (object, local) => {
  const p = object.localToWorld(local).project(camera);
  return [Math.round(((p.x + 1) / 2) * OUT_W * 100) / 100, Math.round(((1 - p.y) / 2) * OUT_H * 100) / 100];
};
const quad = (object, hw, hh, z = 0) => [[-1, 1], [1, 1], [1, -1], [-1, -1]].map(([sx, sy]) => px(object, new THREE.Vector3(sx * hw, sy * hh, z)));
const buttonAt = px(buttonGroup, new THREE.Vector3(0, 0.016, 0));
const buttonEdge = px(buttonGroup, new THREE.Vector3(0.026, 0.016, 0));
document.getElementById("meta").textContent = JSON.stringify({
  variant,
  theme: params.get("theme") ?? "casebook",
  width: OUT_W,
  height: OUT_H,
  screen: quad(screen, SCREEN_W / 2, SCREEN_H / 2),
  button: [...buttonAt, Math.round(Math.hypot(buttonEdge[0] - buttonAt[0], buttonEdge[1] - buttonAt[1]) * 100) / 100],
  coin: quad(coinDoor, 0.075, 0.055, 0.006),
  webp: renderer.domElement.toDataURL("image/webp", 0.85),
});
document.title = "done";
</script>
</body>
</html>
